<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f5f7"><link rel="icon" href="data:,"><title>园区仓储交互方案</title><link rel="stylesheet" href="./style.css?v=20261112-11"><script type="importmap">{"imports":{"three":"./library/vendor/three/build/three.module.js","three/addons/":"./library/vendor/three/examples/jsm/"}}</script></head><body>

<main><div id="viewport" aria-label="三维仓库视图" tabindex="0"></div><aside class="left-panel panel"><div class="section-label">空间</div><nav id="warehouses" aria-label="选择仓库"></nav><div class="section-label floor-heading">楼层</div><div id="floors" class="floor-buttons"></div><div class="panel-rule"></div><div class="logistics-buttons"><button id="inbound" disabled>入库</button><button id="outbound" disabled>出库</button><button id="auto-logistics" aria-pressed="false">自动收发</button><button id="reset-logistics">重置收发</button><button id="focus-logistics">查看收发区</button><button id="focus-production">查看产线</button><button id="follow-cargo" aria-pressed="false">跟随货物</button></div><div class="panel-rule"></div><button id="devices-toggle" class="section-toggle">设备<span>⌄</span></button><div id="devices" class="devices"></div></aside>
<aside class="right-panel panel"><div class="section-label">场景显示</div><label class="switch-row"><span>外层墙体</span><input id="walls" type="checkbox" checked><i></i></label><label class="switch-row"><span>货物</span><input id="goods" type="checkbox" checked><i></i></label><label class="switch-row"><span>建筑名称</span><input id="names" type="checkbox" checked><i></i></label><label class="switch-row"><span>地面网格</span><input id="grid" type="checkbox"><i></i></label><div class="panel-rule"></div><div class="section-label">视图</div><div class="view-buttons"><button data-view="perspective" class="active">◈<span>透视</span></button><button data-view="top">▦<span>俯视</span></button><button data-view="front">▥<span>正视</span></button><button data-view="side">▤<span>侧视</span></button></div><div class="panel-rule"></div><label class="switch-row"><span>自动环绕</span><input id="orbit" type="checkbox"><i></i></label><div class="panel-rule"></div><details class="lighting" open><summary>环境与光照</summary><label class="switch-row"><span>阴影</span><input id="shadows" type="checkbox" checked><i></i></label><label class="switch-row"><span>接触阴影</span><input id="contactShadows" type="checkbox" checked><i></i></label><label class="color-row"><span>背景颜色</span><input id="background-color" type="color" value="#f4f5f7" aria-label="背景颜色"></label><div class="background-presets"><button data-bg="#f4f5f7" style="--swatch:#f4f5f7" aria-label="浅灰背景"></button><button data-bg="#ffffff" style="--swatch:#ffffff" aria-label="白色背景"></button><button data-bg="#777777" style="--swatch:#777777" aria-label="灰色背景"></button><button data-bg="#202020" style="--swatch:#202020" aria-label="深灰背景"></button><button data-bg="#050505" style="--swatch:#050505" aria-label="黑色背景"></button></div><label class="color-row"><span>主光颜色</span><input id="light-color" type="color" value="#fff8ed" aria-label="主光颜色"></label><label class="range-row" for="azimuth"><span>水平角度</span><output id="azimuth-value">−32°</output></label><input class="lighting-slider" id="azimuth" type="range" min="-180" max="180" value="-32" step="1"><label class="range-row" for="elevation"><span>俯仰角度</span><output id="elevation-value">58°</output></label><input class="lighting-slider" id="elevation" type="range" min="0" max="90" value="58" step="1"><label class="range-row" for="light-strength"><span>主光强度</span><output id="light-strength-value">2.6</output></label><input class="lighting-slider" id="light-strength" type="range" min="0" max="8" value="2.6" step="0.1"><label class="range-row" for="ambient-strength"><span>环境光强度</span><output id="ambient-strength-value">0.85</output></label><input class="lighting-slider" id="ambient-strength" type="range" min="0" max="5" value="0.85" step="0.05"><button id="reset-lighting" class="reset-lighting">恢复默认</button></details></aside>
<div class="viewport-tools panel"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">−</button><span></span><button id="focus" aria-label="适应视图">⌖</button></div>
<footer class="playback panel"><button id="play" class="play-button" aria-label="暂停">Ⅱ</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></footer>
<button id="export-4k" class="export-button panel">4K 导出</button>
<div id="loading"><div class="loading-mark">◈</div><div>加载仓库</div><progress id="progress" max="100" value="5"></progress><button id="retry" hidden>重新加载</button></div><div id="toast" role="status"></div></main><script type="module" src="./app.js?v=20261112-11"></script></body></html>
