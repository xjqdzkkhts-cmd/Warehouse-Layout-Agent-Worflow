<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD 平面识别核对</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#202020;font:14px system-ui,sans-serif}header{height:66px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:12px 20px;gap:12px}h1{font-size:18px;margin:0 auto 0 0}button,input,select{font:inherit;border:1px solid #ccc;background:white;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#eee}main{display:grid;grid-template-columns:240px 1fr 300px;height:calc(100vh - 66px)}aside{padding:18px;background:white;overflow:auto}aside:first-child{border-right:1px solid #ddd}aside:last-child{border-left:1px solid #ddd}h2{font-size:14px;margin:20px 0 10px}label{display:block;margin:9px 0}#search,#statusFilter{width:100%}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px}#plan{width:100%;height:100%;touch-action:none;cursor:grab;background:#fafafa}#plan:active{cursor:grabbing}rect.block{stroke:#555;stroke-width:.025;vector-effect:non-scaling-stroke;cursor:pointer}rect.pending{stroke:#d12525;stroke-width:.65;stroke-dasharray:3 3}rect.selected{stroke:black;stroke-width:4}text{pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.035;fill:#222}#details{line-height:1.8;overflow-wrap:anywhere}#decisions[hidden]{display:none}#decisions{display:grid;gap:8px;margin-top:18px}.summary{color:#666;line-height:1.8}#list button{display:block;width:100%;text-align:left;margin:5px 0}#notice{font-size:12px;color:#666}.hint{font-size:12px;color:#888;margin-top:12px}dl{margin:12px 0}dt{color:#777;font-size:12px}dd{margin:0 0 7px}#selectedTitle{font-size:20px}@media(max-width:850px){main{grid-template-columns:180px 1fr}aside:last-child{position:absolute;right:12px;bottom:12px;max-height:38vh;width:250px;border:1px solid #ccc;border-radius:9px}header{flex-wrap:wrap;height:auto}main{height:85vh}h1{font-size:16px}}
</style><header><h1>CAD 平面识别核对</h1><button id="fit">适应视图</button><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="export">导出核对结果</button><button id="import">导入核对结果</button><input id="file" type="file" accept="application/json,.json" hidden></header><main><aside><div id="stats" class="summary"></div><h2>查找图块</h2><input id="search" placeholder="编号、类型或来源"><h2>确认状态</h2><select id="statusFilter"><option selected>待确认</option><option value="all">全部</option><option>已识别</option><option>已确认</option><option>排除</option></select><label><input type="checkbox" id="labels" checked> 显示编号</label><h2>分类颜色</h2><div id="groups"></div><h2>图块列表</h2><div id="list"></div><p class="hint">滚轮缩放，拖动平移。分类颜色仅用于核对，不代表设备实际颜色。</p></aside><svg id="plan" role="img" aria-label="可缩放的 CAD 分类编号平面图"></svg><aside><div id="details">优先核对待确认项。已识别图块作为灰色背景参照，无需逐个确认。</div><div id="decisions" hidden><label>你的判断<textarea id="answer" rows="3" style="width:100%" placeholder="例如：此类每组应为 4 箱位"></textarea></label><label id="sameLabel"><input type="checkbox" id="sameIssue"> 同时更新同一问题的其他图块</label><button data-state="已确认">确认并记录</button><button data-state="待确认">标为待确认</button><button data-state="排除">标为排除</button></div><p id="notice">修改先保存在当前页面内存中；请导出核对结果后交给建模步骤。此页不会直接修改 CAD 或三维场景。</p></aside></main><script id="data" type="application/json">__REVIEW_DATA__</script><script>
'use strict';const data=JSON.parse(document.querySelector('#data').textContent),rows=data.items,byId=new Map(rows.map(r=>[r.id,r])),ns='http://www.w3.org/2000/svg',svg=document.querySelector('#plan'),$=s=>document.querySelector(s),groups=[...new Set(rows.map(r=>r.group))].sort(),enabled=new Set(groups),colors=new Map(groups.map((g,i)=>[g,`hsl(${i*137.508%360} 52% 67%)`]));let selected=null,view,drag,moved=false;
function elem(tag,attrs,parent=svg){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n}function html(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
for(const g of groups){const l=html('label','',$('#groups')),c=html('input','',l);c.type='checkbox';c.checked=true;c.onchange=()=>{c.checked?enabled.add(g):enabled.delete(g);render()};const chip=html('span','',l);chip.className='swatch';chip.style.background=colors.get(g);l.append(document.createTextNode(g))}
function visible(){const q=$('#search').value.toLowerCase(),state=$('#statusFilter').value;return rows.filter(r=>enabled.has(r.group)&&(state==='all'||r.status===state)&&[r.id,r.label,r.group,r.description,r.source].join(' ').toLowerCase().includes(q))}
function bounds(rs){const corners=rs.flatMap(r=>{const a=(r.rotation||0)*Math.PI/180;return [-1,1].flatMap(s=>[-1,1].map(t=>[r.x+s*r.width/2*Math.cos(a)-t*r.depth/2*Math.sin(a),-r.y-s*r.width/2*Math.sin(a)-t*r.depth/2*Math.cos(a)]))});const xs=corners.map(p=>p[0]),ys=corners.map(p=>p[1]);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
function apply(){svg.setAttribute('viewBox',view.join(' '))}function fit(){const rs=visible();if(!rs.length)return;const b=bounds(rs),pad=Math.max(b[2]-b[0],b[3]-b[1],1)*.05;view=[b[0]-pad,b[1]-pad,b[2]-b[0]+2*pad,b[3]-b[1]+2*pad];apply()}
function zoom(f){view=[view[0]+view[2]*(1-f)/2,view[1]+view[3]*(1-f)/2,view[2]*f,view[3]*f];apply()}
function choose(id){selected=id;render();const r=byId.get(id),d=$('#details');d.replaceChildren();html('strong',r.label||r.id,d).id='selectedTitle';const dl=html('dl','',d);for(const [k,v]of [['需要你判断',r.question||'无须补充'],['不确定原因',r.reason||'无'],['判断依据',r.evidence||'见 CAD 来源'],['状态',r.status],['稳定 ID',r.id],['类型',r.group],['说明',r.description||'—'],['尺寸',`${r.width} × ${r.depth} m`],['位置',`${r.x}, ${r.y} m`],['旋转',`${Number((r.rotation||0).toFixed(2))}°`],['CAD 来源',r.source||'未提供']]){html('dt',k,dl);html('dd',String(v),dl)}$('#decisions').hidden=r.status==='已识别';$('#answer').value=r.answer||'';const peers=rows.filter(x=>x.issueKey===r.issueKey);$('#sameLabel').hidden=peers.length<2;$('#sameLabel').lastChild.textContent=` 同时更新同一作用域的 ${peers.length} 个图块`;$('#sameIssue').checked=false;}
function render(){svg.replaceChildren();const rs=visible(),active=new Set(rs.map(r=>r.id));const context=$('#statusFilter').value==='待确认'?rows.filter(r=>!active.has(r.id)):[];for(const r of [...context,...rs]){const muted=!active.has(r.id);const g=elem('g',{transform:`translate(${r.x} ${-r.y}) rotate(${-(r.rotation||0)})`});const n=elem('rect',{x:-r.width/2,y:-r.depth/2,width:r.width,height:r.depth,fill:muted?'#cfd3d5':colors.get(r.group),opacity:muted?.22:r.status==='排除'?.18:.85,class:'block'+(r.status==='待确认'?' pending':'')+(r.id===selected?' selected':''),'data-id':r.id},g);elem('title',{},n).textContent=`${r.id} · ${r.group} · ${r.status}`;n.onclick=()=>{if(!moved)choose(r.id)};if($('#labels').checked&&!muted){elem('text',{x:0,y:0,'text-anchor':'middle','dominant-baseline':'central','font-size':Math.min(r.width*.26,r.depth*.28,.7)},g).textContent=r.label||r.id}}
$('#stats').textContent=`需你判断 ${new Set(rows.filter(r=>r.status==='待确认').map(r=>r.issueKey||r.id)).size} 类问题 · 涉及 ${rows.filter(r=>r.status==='待确认').length} 个图块\n已识别 ${rows.filter(r=>r.status==='已识别').length} 个，无需逐个确认`;$('#list').replaceChildren();for(const r of rs.slice(0,150)){const b=html('button',`${r.label||r.id} · ${r.group}`,$('#list'));b.onclick=()=>{choose(r.id);const span=Math.max(r.width,r.depth)*5;view=[r.x-span/2,-r.y-span/2,span,span];apply()}}if(rs.length>150)html('p','列表显示前 150 项，可搜索定位；平面图显示全部筛选项。',$('#list'))}
for(const b of document.querySelectorAll('[data-state]'))b.onclick=()=>{if(selected){const r=byId.get(selected),answer=$('#answer').value.trim();if(b.dataset.state==='已确认'&&r.question&&!answer){$('#notice').textContent='请写下你的判断，再确认这项问题。';return}const targets=$('#sameIssue').checked&&r.issue?rows.filter(x=>x.issueKey===r.issueKey):[r];for(const x of targets){x.status=b.dataset.state;x.answer=answer}choose(selected);$('#notice').textContent=`已更新 ${targets.length} 个相关图块，请导出核对结果；合并后仍需校验参数，确认不等于可生成。`;}};
$('#search').oninput=render;$('#statusFilter').onchange=render;$('#labels').onchange=render;$('#fit').onclick=fit;$('#zoomIn').onclick=()=>zoom(.8);$('#zoomOut').onclick=()=>zoom(1.25);
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:1/1.15)},{passive:false});svg.onpointerdown=e=>{const m=svg.getScreenCTM().inverse();drag={x:e.clientX,y:e.clientY,view:[...view],sx:m.a,sy:m.d};moved=false};svg.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)moved=true;view=[drag.view[0]-dx*drag.sx,drag.view[1]-dy*drag.sy,...drag.view.slice(2)];apply()};window.addEventListener('pointerup',()=>drag=null);
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...data,items:rows,reviewedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='CAD核对结果.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.sourceId!==data.sourceId||d.items.length!==rows.length||new Set(d.items.map(r=>r.id)).size!==rows.length||d.items.some(r=>!byId.has(r.id)||!['已识别','已确认','待确认','排除'].includes(r.status)))throw Error('图纸或编号不匹配');for(const r of d.items){byId.get(r.id).status=r.status;byId.get(r.id).answer=typeof r.answer==='string'?r.answer:'';}render();if(selected)choose(selected);$('#notice').textContent='核对状态已导入。完成后请重新导出。'}catch(err){$('#notice').textContent='未导入：'+err.message}};
render();fit();
</script></html>
